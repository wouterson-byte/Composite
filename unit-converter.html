<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Composite</title>
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<script>
  tailwind = { config: {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: {
        mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
        sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'sans-serif']
      }
    } }
  } };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body class="min-h-screen bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 font-sans transition-colors">

<div class="max-w-2xl mx-auto px-6 py-14 sm:py-20">

  <header class="flex items-start justify-between gap-6 mb-12">
    <div class="flex flex-col gap-1.5">
      <a href="index.html" class="font-mono text-xs text-emerald-600 dark:text-emerald-400 hover:underline">$ cd ../composite</a>
      <h1 class="font-mono font-semibold text-2xl sm:text-3xl tracking-tight">Unit Converter</h1>
    </div>

    <div id="theme-toggle" class="flex items-center gap-0.5 rounded-md border border-neutral-300 dark:border-neutral-700 overflow-hidden font-mono text-xs shrink-0">
      <button type="button" data-theme-btn="light" class="px-3 py-2 transition-colors">LIGHT</button>
      <button type="button" data-theme-btn="dark" class="px-3 py-2 transition-colors">DARK</button>
    </div>
  </header>

  <main>
    <div class="rounded-sm border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 overflow-hidden">
      <div class="flex items-center gap-1.5 px-3 py-2 border-b border-neutral-200 dark:border-neutral-800">
        <span class="w-1.5 h-1.5 rounded-full bg-neutral-300 dark:bg-neutral-700"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-neutral-300 dark:bg-neutral-700"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-neutral-300 dark:bg-neutral-700"></span>
        <span class="ml-1.5 font-mono text-[11px] text-neutral-500 dark:text-neutral-400">unit-converter.html</span>
      </div>

      <div class="flex flex-col gap-6 p-8 sm:p-10">

        <label class="flex flex-col gap-2 font-mono text-xs text-neutral-500 dark:text-neutral-400">
          category
          <select id="category-select" class="rounded-sm border border-neutral-300 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm text-neutral-900 dark:text-neutral-100 font-sans">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
          </select>
        </label>

        <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] gap-4 items-end">
          <label class="flex flex-col gap-2 font-mono text-xs text-neutral-500 dark:text-neutral-400">
            from
            <div class="flex flex-col gap-2">
              <input id="from-value" type="number" value="1" class="rounded-sm border border-neutral-300 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm text-neutral-900 dark:text-neutral-100 font-sans">
              <select id="from-unit" class="rounded-sm border border-neutral-300 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm text-neutral-900 dark:text-neutral-100 font-sans"></select>
            </div>
          </label>

          <button id="swap-btn" type="button" aria-label="Swap units" class="mb-2 self-center rounded-sm border border-neutral-300 dark:border-neutral-700 p-2.5 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors text-neutral-600 dark:text-neutral-400">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13"></path><path d="M14 3l4 4-4 4"></path><path d="M20 17H7"></path><path d="M10 21l-4-4 4-4"></path></svg>
          </button>

          <label class="flex flex-col gap-2 font-mono text-xs text-neutral-500 dark:text-neutral-400">
            to
            <div class="flex flex-col gap-2">
              <span id="to-value" class="rounded-sm border border-emerald-600/30 dark:border-emerald-400/30 bg-emerald-600/5 dark:bg-emerald-400/5 px-3 py-2 text-sm font-mono text-emerald-700 dark:text-emerald-300 tabular-nums">0</span>
              <select id="to-unit" class="rounded-sm border border-neutral-300 dark:border-neutral-700 bg-transparent px-3 py-2 text-sm text-neutral-900 dark:text-neutral-100 font-sans"></select>
            </div>
          </label>
        </div>

      </div>
    </div>
  </main>

</div>

<script>
  var UNIT_GROUPS = {
    length: {
      base: 'm',
      units: {
        mm: 0.001, cm: 0.01, m: 1, km: 1000,
        in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344
      }
    },
    weight: {
      base: 'g',
      units: {
        mg: 0.001, g: 1, kg: 1000, oz: 28.3495, lb: 453.592
      }
    },
    temperature: {
      base: 'C',
      units: { C: 'C', F: 'F', K: 'K' }
    }
  };

  var categorySelect = document.getElementById('category-select');
  var fromUnitSelect = document.getElementById('from-unit');
  var toUnitSelect = document.getElementById('to-unit');
  var fromValueInput = document.getElementById('from-value');
  var toValueSpan = document.getElementById('to-value');
  var swapBtn = document.getElementById('swap-btn');

  function populateUnitSelects() {
    var category = categorySelect.value;
    var unitKeys = Object.keys(UNIT_GROUPS[category].units);
    [fromUnitSelect, toUnitSelect].forEach(function (select) {
      select.innerHTML = unitKeys.map(function (u) {
        return '<option value="' + u + '">' + u + '</option>';
      }).join('');
    });
    fromUnitSelect.value = unitKeys[0];
    toUnitSelect.value = unitKeys[1] || unitKeys[0];
  }

  function toCelsius(value, unit) {
    if (unit === 'C') return value;
    if (unit === 'F') return (value - 32) * (5 / 9);
    if (unit === 'K') return value - 273.15;
  }

  function fromCelsius(celsius, unit) {
    if (unit === 'C') return celsius;
    if (unit === 'F') return celsius * (9 / 5) + 32;
    if (unit === 'K') return celsius + 273.15;
  }

  function convert() {
    var category = categorySelect.value;
    var value = Number(fromValueInput.value || 0);
    var fromUnit = fromUnitSelect.value;
    var toUnit = toUnitSelect.value;
    var result;

    if (category === 'temperature') {
      result = fromCelsius(toCelsius(value, fromUnit), toUnit);
    } else {
      var units = UNIT_GROUPS[category].units;
      var baseValue = value * units[fromUnit];
      result = baseValue / units[toUnit];
    }

    toValueSpan.textContent = Number(result.toFixed(6)).toString();
  }

  categorySelect.addEventListener('change', function () {
    populateUnitSelects();
    convert();
  });
  fromUnitSelect.addEventListener('change', convert);
  toUnitSelect.addEventListener('change', convert);
  fromValueInput.addEventListener('input', convert);

  swapBtn.addEventListener('click', function () {
    var fromUnit = fromUnitSelect.value;
    fromUnitSelect.value = toUnitSelect.value;
    toUnitSelect.value = fromUnit;
    convert();
  });

  populateUnitSelects();
  convert();

  function setTheme(theme) {
    try { localStorage.setItem('theme', theme); } catch (e) {}
    document.documentElement.classList.toggle('dark', theme === 'dark');
    syncThemeToggle();
  }

  function syncThemeToggle() {
    var isDark = document.documentElement.classList.contains('dark');
    document.querySelectorAll('[data-theme-btn]').forEach(function (btn) {
      var active = (btn.dataset.themeBtn === 'dark') === isDark;
      btn.classList.toggle('bg-emerald-600/15', active);
      btn.classList.toggle('text-emerald-700', active);
      btn.classList.toggle('dark:bg-emerald-400/15', active);
      btn.classList.toggle('dark:text-emerald-300', active);
      btn.classList.toggle('text-neutral-500', !active);
      btn.classList.toggle('dark:text-neutral-400', !active);
    });
  }

  document.querySelectorAll('[data-theme-btn]').forEach(function (btn) {
    btn.addEventListener('click', function () { setTheme(btn.dataset.themeBtn); });
  });

  syncThemeToggle();
</script>
</body>
</html>
